<style>

:root{
    --blue:#69a7ff;
    --blue2:#8dc2ff;
    --dark:#030816;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:black;
    color:white;
    font-family:'Space Grotesk',sans-serif;

    overflow-x:hidden;
    overflow-y:auto;

    min-height:100vh;

    -webkit-font-smoothing:antialiased;
}

/* ================= BACKGROUND ================= */

#bg{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

   filter:
   brightness(0.45)
   blur(1px);

    z-index:-3;

    transform:scale(1.08);

    transition:opacity 0.6s ease;
}

.overlay{
    position:fixed;
    inset:0;

    z-index:-2;

    background:
    radial-gradient(circle at top left,
    rgba(105,167,255,0.16),
    transparent 40%),

    radial-gradient(circle at bottom right,
    rgba(105,167,255,0.08),
    transparent 40%),

    linear-gradient(
    to bottom,
    rgba(0,0,0,0.4),
    rgba(0,0,0,0.88));
}

#particles{
    position:fixed;
    inset:0;
    z-index:-1;
}

/* ================= START SCREEN ================= */

.start-screen{
    position:fixed;
    inset:0;

    background:black;

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    padding:30px;

    text-align:center;

    z-index:100;
}

.start-title{
    font-size:clamp(3rem,10vw,5rem);

    font-family:'Playfair Display',serif;

    margin-bottom:18px;

    background:linear-gradient(
    135deg,
    #69a7ff,
    #ffffff);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.start-sub{
    color:rgba(255,255,255,0.65);

    letter-spacing:0.15em;

    margin-bottom:35px;

    font-size:0.9rem;
}

.start-btn{
    padding:16px 32px;

    border:none;

    border-radius:18px;

    background:linear-gradient(
    135deg,
    #69a7ff,
    #2e6eff);

    color:white;

    font-weight:700;

    cursor:pointer;

    font-size:1rem;

    box-shadow:
    0 0 35px rgba(105,167,255,0.4);

    transition:0.35s ease;
}

.start-btn:hover{
    transform:scale(1.05);
}

/* ================= MAIN ================= */

.container{
    width:100%;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;
}

/* ================= STORY BOX ================= */

.story-box{

    width:min(1000px,100%);

    background:rgba(255,255,255,0.06);

    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(18px);

    border-radius:28px;

    padding:30px;

    position:relative;

    overflow:hidden;

    box-shadow:
    0 0 60px rgba(105,167,255,0.08);

    margin:40px 0;
}

/* ================= TOP ================= */

.month{

    color:var(--blue2);

    letter-spacing:0.15em;

    font-size:0.8rem;

    margin-bottom:12px;
}

.title{

    font-size:clamp(2.2rem,8vw,4rem);

    font-family:'Playfair Display',serif;

    margin-bottom:12px;

    line-height:1.1;

    background:linear-gradient(
    135deg,
    #69a7ff,
    white);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.scene{

    display:inline-block;

    padding:10px 18px;

    border-radius:999px;

    background:rgba(105,167,255,0.1);

    border:1px solid rgba(105,167,255,0.2);

    color:#cfe5ff;

    margin-bottom:30px;

    font-size:0.9rem;
}

/* ================= DIALOGUE ================= */

.dialogue{

    font-family:'Crimson Text',serif;

    font-size:clamp(1.15rem,4vw,1.4rem);

    line-height:2;

    color:rgba(255,255,255,0.94);

    margin-bottom:35px;

    word-break:break-word;
}

.quote{

    margin:25px 0;

    padding:18px;

    border-left:3px solid var(--blue);

    background:rgba(105,167,255,0.08);

    border-radius:14px;

    color:#d7e9ff;

    font-style:italic;
}

/* ================= CHOICES ================= */

.choices{
    display:grid;
    gap:14px;

    margin-bottom:30px;
}

.choice{

    padding:18px;

    border-radius:18px;

    background:rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.08);

    color:white;

    cursor:pointer;

    transition:0.3s ease;

    text-align:left;

    font-size:0.95rem;
}

.choice:hover{

    background:rgba(105,167,255,0.08);

    border-color:rgba(105,167,255,0.35);

    transform:translateY(-2px);
}

/* ================= FOOTER ================= */

.footer{

    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:15px;

    flex-wrap:wrap;
}

.progress-section{
    display:flex;
    align-items:center;
    gap:10px;
    color:rgba(255,255,255,0.6);
    font-size:0.9rem;
}

.progress-bar-mini{
    width:80px;
    height:3px;
    background:rgba(105,167,255,0.2);
    border-radius:999px;
    overflow:hidden;
}

.progress-bar-mini-fill{
    height:100%;
    background:linear-gradient(90deg, #69a7ff, #2e6eff);
    width:0%;
    transition:width 0.6s ease;
    box-shadow:0 0 10px rgba(105,167,255,0.5);
}

.button-group{
    display:flex;
    gap:12px;
}

.nav-btn{
    padding:12px 24px;
    border:1px solid rgba(255,255,255,0.1);
    border-radius:12px;
    background:rgba(255,255,255,0.05);
    color:white;
    font-weight:700;
    cursor:pointer;
    font-size:0.9rem;
    transition:all 0.3s ease;
    font-family:'Space Grotesk',sans-serif;
}

.nav-btn:hover:not(:disabled){
    background:rgba(105,167,255,0.1);
    border-color:rgba(105,167,255,0.3);
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(105,167,255,0.15);
}

.nav-btn:disabled {
    opacity:0.3;
    cursor:not-allowed;
}

.nav-btn.primary{
    background:linear-gradient(135deg, #69a7ff, #2e6eff);
    border:none;
    box-shadow:0 0 25px rgba(105,167,255,0.35);
}

.nav-btn.primary:hover:not(:disabled){
    box-shadow:0 0 40px rgba(105,167,255,0.6);
    transform:scale(1.03);
}

.next{
    padding:14px 26px;
    border:none;
    border-radius:16px;
    background:linear-gradient(135deg, #69a7ff, #2e6eff);
    color:white;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 0 25px rgba(105,167,255,0.35);
    transition:0.35s ease;
}

.next:hover{
    transform:scale(1.03);
}

/* ================= FINAL ================= */

.final{
    text-align:center;
    padding:40px 10px;
    animation:fade 2s ease;
}

.final h1{
    font-size:clamp(2.8rem,10vw,5rem);
    font-family:'Playfair Display',serif;
    margin-bottom:25px;
    background:linear-gradient(135deg, #69a7ff, white);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.final p{
    max-width:700px;
    margin:auto;
    line-height:2;
    font-size:1.15rem;
    color:rgba(255,255,255,0.88);
    font-family:'Crimson Text',serif;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* ================= MOBILE FIXES ================= */

@media(max-width:768px){
    .container{
        align-items:flex-start;
    }

    .story-box{
        padding:24px;
        border-radius:24px;
        margin-top:20px;
        margin-bottom:20px;
    }

    .dialogue{
        line-height:1.9;
    }

    .footer{
        flex-direction:column;
        align-items:stretch;
    }

    .button-group{
        flex-direction:column;
        width:100%;
    }

    .nav-btn{
        width:100%;
    }

    .progress-section{
        justify-content:center;
        width:100%;
    }

    .final h1{
        font-size:clamp(2rem,8vw,3.5rem);
    }

    .final p{
        font-size:1rem;
        line-height:2;
    }
}

</style>
</head>

let current = 0;

const month = document.getElementById("month");
const title = document.getElementById("title");
const scene = document.getElementById("scene");
const dialogue = document.getElementById("dialogue");
const choices = document.getElementById("choices");
const bg = document.getElementById("bg");
const progress = document.getElementById("progress");
const progressFill = document.getElementById("progressFill");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

function startStory(){

    document.getElementById("bgMusic").volume = 0.35;
    document.getElementById("bgMusic").play();

    gsap.to("#startScreen",{

        opacity:0,
        duration:1,

        onComplete:()=>{

            document.getElementById("startScreen").style.display="none";

        }

    });

    updateScene();
}

let typingInterval;

function typeWriter(text){

    clearInterval(typingInterval);

    dialogue.innerHTML = "";

    let i = 0;

    const plainText = text;

    typingInterval = setInterval(()=>{

        dialogue.innerHTML = plainText.substring(0, i);

        i++;

        if(i > plainText.length){

            clearInterval(typingInterval);

            dialogue.innerHTML = text;

        }

    },12);

}

function updateScene(){

    const s = story[current];

    clearInterval(typingInterval);

    gsap.killTweensOf("#bg");
    gsap.killTweensOf(".story-box");

    month.textContent = s.month;
    title.textContent = s.title;
    scene.textContent = s.scene;

    progress.textContent =
    `${current+1} / ${story.length}`;

    const newBg = new Image();

    newBg.src = s.bg;

    newBg.onload = () => {

        gsap.to("#bg",{
            opacity:0.85,
            duration:0.15,

            onComplete:()=>{

                bg.src = s.bg;

                gsap.to("#bg",{
                    opacity:1,
                    duration:0.25
                });

            }
        });

    };

    typeWriter(s.text);

    choices.innerHTML="";

    s.choices.forEach(choice=>{

        let btn = document.createElement("button");

        btn.className="choice";

        btn.innerText = choice;

        btn.onclick = nextScene;

        choices.appendChild(btn);

    });

    gsap.fromTo(".story-box",

        {
            y:10,
            opacity:0.96
        },

        {
            y:0,
            opacity:1,
            duration:0.35,
            ease:"power2.out"
        }

    );

    prevBtn.disabled = current === 0;
    nextBtn.disabled = false;

    const progressPercent = ((current + 1) / story.length) * 100;
    progressFill.style.width = progressPercent + "%";
}

function nextScene(){

    clearInterval(typingInterval);

    if(current < story.length-1){

        current++;

        updateScene();

    }else{
        
        document.getElementById("bgMusic").pause();

        const birthday = document.getElementById("birthdayMusic");

         birthday.volume = 0.45;
         birthday.play(); 

        document.getElementById("storyBox").innerHTML=`

        <div class="final">

        <h1>
        Happy Birthday Ivy 💙
        </h1>

        <p>
        From Cloud Ten...
        to late night calls...
        to every laugh and every memory...

        thank you for making life brighter.

        Happy 6 Months 💙
        </p>

        </div>

        `;

    }

}

function previousScene(){

    clearInterval(typingInterval);

    if(current > 0){

        current--;

        updateScene();

    }

}

        },

        size:{
            value:{min:1,max:3}
        },

        move:{
            enable:true,
            speed:0.5
        }

    }

});
